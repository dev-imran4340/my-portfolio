name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/${REPO_NAME}/" --no-wasm-dry-run --no-web-resources-cdn

      - name: Prepare site files
        run: |
          cp assets/cv.pdf build/web/cv.pdf
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
          ls -la build/web/cv.pdf build/web/404.html build/web/.nojekyll

      # Publishes build/web → gh-pages branch.
      # You must still enable Pages once in GitHub Settings
      # (Source: Deploy from a branch → gh-pages → /).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          enable_jekyll: false
